version: '3.8'

services:
  web:
    image: ev3thlm/cn2-agendatec:latest
    ports:
      - target: 5000
        published: 5051
        protocol: tcp
        mode: ingress
    environment:
      DATABASE_URL: "postgresql+psycopg://agenda_user:${POSTGRES_PASSWORD:-changeme}@db:5432/agenda_db"
    depends_on:
      - db
    networks:
      - examen_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
      update_config:
        parallelism: 1
        order: start-first

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenda_db
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - examen_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

volumes:
  postgres_data:
    driver: local

networks:
  examen_net:
    driver: overlay
